[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transit_advisor"
version = "0.1.0"
description = "A transit route planning and travel advisory application"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Your Name", email = "you@example.com" }
]

keywords = ["transit", "routing", "transportation", "travel", "navigation"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "python-dotenv",
    "pytest",

]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/transit-advisor"
Repository = "https://github.com/yourusername/transit-advisor"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transit_advisor = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "--cov=src/transit_advisor",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=70",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true

warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict = true
no_implicit_optional = true
strict_equality = true

show_error_codes = true
pretty = true

# Ignore generated migration files
exclude = [
    "^alembic/"
]



[tool.coverage.run]
source = ["src/transit_advisor"]

omit = [
    "*/tests/*",
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
